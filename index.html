<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>p2pong</title>
    <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    [hidden] { display: none !important; }

    #menu {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    #menu button {
      width: 200px;
      padding: 14px 0;
      background: #000;
      color: #fff;
      border: 2px solid #fff;
      border-radius: 0;
      font: 20px sans-serif;
      cursor: pointer;
      outline: none;
    }

    #hud {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      color: rgba(255, 255, 255, 0.45);
      font: 20px sans-serif;
    }
    .player { position: absolute; top: 20px; }
    .player.left { left: 24px; }
    .player.right { right: 24px; text-align: right; }
    </style>
    <link data-trunk rel="rust" />
  </head>
  <body>
  <div id="menu">
    <button id="btn-local">Local</button>
    <button id="btn-online">Online</button>
  </div>
  <div id="hud" hidden>
    <div class="player left"><div>Player 1</div><div id="wins1"></div></div>
    <div class="player right"><div>Player 2</div><div id="wins2"></div></div>
  </div>
</body>
</html>
