[lib]
crate-type = ["cdylib", "rlib"]

[package]
name = "p2pong"
version = "0.1.0"
edition = "2024"

[dependencies]
console_error_panic_hook = "0.1.7"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-time = "1.1.0"
wgpu = { version = "30.0.1", features = ["webgl"] }
winit = "0.30.13"
web-sys = { version = "0.3", features = ["console", "Window", "Document", "Element", "HtmlElement", "EventTarget"] }
